[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apachelog"
version = "1.1.0"
description = "Apache access log parser"
readme = "README.md"
license = "Artistic-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Harry Fuecks", email = "hfuecks@gmail.com" },
]
maintainers = [
    { name = "Nick Moorman", email = "nick@nickmoorman.com" },
]
keywords = ["apache", "log", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Log Analysis",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/shotakaha/apachelog"
Repository = "https://github.com/shotakaha/apachelog"
Issues = "https://github.com/shotakaha/apachelog/issues"

[tool.setuptools]
py-modules = ["apachelog"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.0"
version_provider = "pep621"
version_files = ["apachelog.py:__version__"]
tag_format = "v$version"
changelog_file = "CHANGELOG"
