[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apachelog"
version = "1.1"
description = "Apache access log parser"
readme = "README.md"
license = { text = "Artistic License" }
requires-python = ">=3.8"
authors = [
    { name = "Harry Fuecks", email = "hfuecks@gmail.com" },
]
maintainers = [
    { name = "Nick Moorman", email = "nick@nickmoorman.com" },
]
keywords = ["apache", "log", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Artistic License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Log Analysis",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/shotakaha/apachelog"

[tool.setuptools]
py-modules = ["apachelog"]
